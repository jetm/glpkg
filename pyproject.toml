[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlab-pkg-upload"
version = "0.1.0"
description = "A CLI tool for uploading files to GitLab's Generic Package Registry"
authors = [{name = "Javier Tia"}]
license = {text = "MIT"}
requires-python = ">=3.11"
readme = "README.md"
keywords = ["gitlab", "package", "upload", "cli", "generic-package-registry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "python-gitlab>=4.0.0",
    "rich>=13.0.0",
    "GitPython>=3.1.0",
    "tenacity>=8.0.0",
    "argcomplete>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pre-commit",
]
test = [
    "pytest",
    "pytest-xdist",
    "pytest-timeout",
    "pytest-sugar",
]

[project.scripts]
gitlab-pkg-upload = "gitlab_pkg_upload.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: Unit tests that don't require external dependencies",
    "integration: Integration tests requiring GitLab API access",
    "fast: Fast-running tests",
    "slow: Slow-running tests",
]
